name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master, remaster ]

env:
  HAXE_VERSION: 4.2.5

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup Haxe
      uses: krdlab/setup-haxe@v1
      with:
        haxe-version: ${{ env.HAXE_VERSION }}

    - name: Install dependencies
      run: |
        haxelib newrepo
        haxelib install lime
        haxelib install openfl
        haxelib install flixel
        haxelib install flixel-addons
        haxelib install flixel-ui
        haxelib install hscript
        haxelib install polymod
        haxelib setup lime

    - name: Build HTML5 Release
      run: haxelib run lime build html5 -final

    - name: Copy build output to docs/game
      run: |
        mkdir -p docs/game
        cp -r export/release/html5/bin/* docs/game/
        ls -la docs/game | head -20

    - name: Commit built game to docs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git diff --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git add docs/game
        git commit -m "Deploy game build to GitHub Pages [skip ci]"
        git push origin HEAD:${{ github.ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

